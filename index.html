<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Source Finder</title>
    <style>
      :root {
        --accent: #8b5cf6;
        --bg: #050505;
        --card: #111;
        --text: #eee;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        width: 100%;
        max-width: 600px;
        background: var(--card);
        padding: 25px;
        border-radius: 20px;
        border: 1px solid #333;
        align-self: center;
      }
      h1 {
        font-size: 1.5rem;
        text-align: center;
        color: var(--accent);
        margin-bottom: 20px;
      }
      input {
        width: 100%;
        padding: 15px;
        background: #000;
        border: 1px solid #444;
        border-radius: 12px;
        color: #fff;
        margin-bottom: 15px;
        box-sizing: border-box;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      .instruction {
        font-size: 0.85rem;
        color: #888;
        margin-bottom: 15px;
        text-align: center;
      }
      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 20px;
      }
      button {
        padding: 12px;
        border: 1px solid #333;
        border-radius: 10px;
        cursor: pointer;
        background: #1a1a1a;
        color: #fff;
        font-weight: 500;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      button:hover {
        background: var(--accent);
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .source-tag {
        font-size: 0.7rem;
        display: block;
        opacity: 0.7;
        margin-top: 4px;
        font-weight: normal;
      }

      /* Optimización Móvil */
      @media (max-width: 600px) {
        .btn-group {
          grid-template-columns: 1fr;
        }
        button {
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚀 Investigador AI</h1>

      <input type="text" id="topic" placeholder="¿Qué quieres investigar?" />

      <p class="instruction">Motores de búsqueda con IA y fuentes:</p>
      <div class="btn-group">
        <button onclick="aiSearch('google')">
          Google Search 🔍
          <span class="source-tag">Resultados generales</span>
        </button>
        <button onclick="aiSearch('perplexity')">
          Perplexity 🌐
          <span class="source-tag">Citas y fuentes reales</span>
        </button>
        <button onclick="aiSearch('scholar')">
          Google Scholar 🎓
          <span class="source-tag">Artículos académicos</span>
        </button>
        <button onclick="aiSearch('brave')">
          Brave AI 🦁
          <span class="source-tag">Resumen privado</span>
        </button>
      </div>

      <p class="instruction">Consultas directas a Chatbots:</p>
      <div class="btn-group" style="grid-template-columns: 1fr">
        <button onclick="aiSearch('chatgpt')">
          ChatGPT 🤖
          <span class="source-tag">Análisis profundo y estructurado</span>
        </button>
        <button onclick="aiSearch('gemini')">
          Gemini (Google) ✨
          <span class="source-tag">Integración con datos de Google</span>
        </button>
      </div>
    </div>

    <script>
      function aiSearch(engine) {
        const query = document.getElementById("topic").value;
        if (!query) {
          alert("Por favor, escribe un tema.");
          return;
        }

        const aiCommand = `proporciona información detallada sobre "${query}" incluyendo enlaces directos y reales a las fuentes originales, sitios web oficiales y documentos de referencia.`;
        const encodedQuery = encodeURIComponent(query);
        const encodedCommand = encodeURIComponent(aiCommand);

        let url = "";

        switch (engine) {
          case "google":
            url = `https://www.google.com/search?q=${encodedCommand}`;
            break;
          case "perplexity":
            url = `https://www.perplexity.ai/search?q=${encodedCommand}`;
            break;
          case "brave":
            url = `https://search.brave.com/search?q=${encodedCommand}&source=web`;
            break;
          case "scholar":
            url = `https://scholar.google.com/scholar?q=${encodedQuery}`;
            break;
          case "chatgpt":
            // Corregido: Ahora usa encodedCommand correctamente
            url = `https://chatgpt.com/?q=${encodedCommand}`;
            break;
          case "gemini":
            navigator.clipboard.writeText(aiCommand);
            alert("El texto se copió. Pégalo en Gemini (Ctrl + V).");
            url = "https://gemini.google.com/app";
            break;
        }

        if (url) {
          window.open(url, "_blank");
        }
      }
    </script>
  </body>
</html>
