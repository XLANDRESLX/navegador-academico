<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Investigador Pro | Links Directos</title>
    <style>
        :root { --p: #6366f1; --bg: #0f172a; --card: #1e293b; --txt: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--txt); display: flex; justify-content: center; padding: 20px; }
        .box { width: 100%; max-width: 650px; background: var(--card); padding: 25px; border-radius: 15px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        h2 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; color: var(--p); }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; margin-bottom: 15px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; background: #334155; color: white; font-weight: bold; transition: 0.2s; }
        button:hover { background: var(--p); }
        .section-label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; margin: 15px 0 8px; font-weight: bold; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    </style>
</head>
<body>

<div class="box">
    <h2>🔍 Investigador de Fuentes Reales</h2>
    <input type="text" id="query" placeholder="Ej: Energías renovables, Historia de Roma, PHP avanzado...">

    <div class="section-label">Búsqueda Directa (Links Web)</div>
    <div class="grid">
        <button onclick="search('gov')">🏛️ Sitios Oficiales (.gov)</button>
        <button onclick="search('news')">📰 Noticias y Prensa</button>
        <button onclick="search('org')">🌐 Organizaciones (.org)</button>
        <button onclick="search('edu')">🎓 Académico (.edu)</button>
    </div>

    <div class="section-label">Investigación de Archivos</div>
    <div class="grid">
        <button onclick="search('pdf')">📄 Libros/Reportes (PDF)</button>
        <button onclick="search('data')">📊 Datos y Estadísticas</button>
    </div>

    <div class="section-label">Asistente IA (Generar Comando)</div>
    <button style="width:100%; background: var(--p);" onclick="generateAIPrompt()">🤖 Crear Prompt para investigar con IA</button>
    
    <div id="ai-box" style="display:none; margin-top:15px; padding:12px; background:#0f172a; border-radius:8px; font-size:0.9rem; border: 1px dashed var(--p);">
        <p id="prompt-text"></p>
        <button onclick="copyPrompt()" style="width:100%; background:#22c55e; margin-top:10px;">Copiar Comando</button>
    </div>
</div>

<script>
    function search(type) {
        const q = document.getElementById('query').value;
        if(!q) return alert("Escribe un tema");
        let url = "";
        
        switch(type) {
            case 'gov': url = `https://www.google.com/search?q=site:.gov OR site:.gob "${q}"`; break;
            case 'news': url = `https://www.google.com/search?q="${q}"&tbm=nws`; break;
            case 'org': url = `https://www.google.com/search?q=site:.org "${q}"`; break;
            case 'edu': url = `https://scholar.google.com/scholar?q=${q}`; break;
            case 'pdf': url = `https://www.google.com/search?q=filetype:pdf "${q}"`; break;
            case 'data': url = `https://www.google.com/search?q="${q}" (datos OR estadísticas OR datasets OR cifras)`; break;
        }
        window.open(url, '_blank');
    }

    function generateAIPrompt() {
        const q = document.getElementById('query').value;
        if(!q) return alert("Escribe un tema");
        const prompt = `Investiga sobre "${q}". Por favor, no inventes información. Necesito que me proporciones una síntesis del tema y, OBLIGATORIAMENTE, una lista de al menos 5 enlaces (URLs) reales de sitios web oficiales, medios de comunicación reconocidos o bibliotecas digitales donde pueda validar la información. Verifica que los links funcionen actualmente.`;
        document.getElementById('prompt-text').innerText = prompt;
        document.getElementById('ai-box').style.display = 'block';
    }

    function copyPrompt() {
        navigator.clipboard.writeText(document.getElementById('prompt-text').innerText);
        alert("¡Copiado! Pégalo en tu IA.");
    }
</script>

</body>
</html>
